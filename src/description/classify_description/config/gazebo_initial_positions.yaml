# =============================================================================
# gazebo_initial_positions.yaml  --  Gazebo 初始位姿
# =============================================================================
# 这个文件的内容会被 xacro 注入到 ros2_control 的 <state_interface>，
# 即 Gazebo 启动瞬间各关节的初始角度。
#
# -----------------------------------------------------------------------------
# 手臂：用官方 HOME 位姿
# -----------------------------------------------------------------------------
# 官方 agx_arm_sim 用的是 [0, 1.2, -1.2, 0, 0, 0]。实测该位姿下
# link6 的 z 轴指向水平前方（垂直度 = -0.09），工具完全无法抓取，
# 因为夹爪伸出方向与重力方向垂直。
#
# 改用接近松灵官方 HOME 的限位内位姿 [0, 50, -70, 0, 69.9, 0] 度：
#   垂直度 = +0.71  （即工具朝下倾斜约 45 度，斜向下抓取）
#   TCP 位置 = base_link 系 (0.2012, 0, 0.3305)
#
# 为什么不直接用垂直向下的位姿（垂直度 = 1.0）？
#   piper_joint2 限位 [0, 3.14]、piper_joint3 限位 [-2.967, 0] 都是单侧的，
#   肘部构型被锁定，实测该机械臂在严格垂直向下抓取时可达区域非常有限。
#   45 度斜抓是这台机械臂的真实工作姿态，与 toy_pick_ws 抓玩具时用的
#   "斜向下抓取" 一致（见其 grasp_config.py 的 PICK_ORIENTATION 注释）。
# =============================================================================

initial_positions:
  # 手臂 6 关节（弧度）。joint5 上限是 1.22，不能使用 70°=1.22173。
  joint1:  0.0
  joint2:  0.87266      # 50 度
  joint3: -1.22173      # -70 度
  joint4:  0.0
  joint5:  1.22         # 关节上限，约 69.9 度
  joint6:  0.0

  # 夹爪 2 关节（米，镜像）
  #   初始 = 全闭，与官方 SRDF 的 group_state "close" 定义一致：
  #       <group_state name="close" group="gripper">
  #         <joint name="gripper_joint1" value="0"/>
  #         <joint name="gripper_joint2" value="0"/>
  #       </group_state>
  #   限位：joint7 ∈ [0, 0.035]，joint8 ∈ [-0.035, 0]
  #         对称关系 joint8 = -joint7（等值反号，两指运动轴方向相反）
  #   全开 = (0.035, -0.035)，开口 70mm
  #   全闭 = (0.0005, -0.0005)，留 1mm 间隙避免两指网格原点重合
  joint7:  0.0
  joint8:  0.0
